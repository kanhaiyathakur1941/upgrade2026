<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upgrade 2026 — Career documentation</title>
<style>
:root {
  --bg:#eef1f6; --paper:#fff; --ink:#0f172a; --muted:#475569; --line:#d8dee9;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-ink:#1e40af; --soft:#eff6ff;
  --good:#047857; --good-soft:#ecfdf5; --warn:#9a3412; --warn-soft:#fff7ed;
  --bad:#b91c1c; --code:#0f172a; --code-bg:#f1f5f9;
  --shadow:0 4px 24px rgba(15,23,42,.08); --sidebar:300px; --header-h:120px;
  --bottom-nav:0px; --radius:14px; --tap:44px;
  color-scheme:light;
}
html[data-theme="dark"] {
  --bg:#0b0f14; --paper:#141a22; --ink:#f1f5f9; --muted:#94a3b8; --line:#2a3441;
  --accent:#60a5fa; --accent-hover:#93c5fd; --accent-ink:#dbeafe; --soft:#1a2740;
  --good:#34d399; --good-soft:#052e24; --warn:#fcd34d; --warn-soft:#2a2110;
  --bad:#fca5a5; --code:#e2e8f0; --code-bg:#0b1020;
  --shadow:0 8px 32px rgba(0,0,0,.45); color-scheme:dark;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme="light"]) {
    --bg:#0b0f14; --paper:#141a22; --ink:#f1f5f9; --muted:#94a3b8; --line:#2a3441;
    --accent:#60a5fa; --accent-hover:#93c5fd; --accent-ink:#dbeafe; --soft:#1a2740;
    --good:#34d399; --good-soft:#052e24; --warn:#fcd34d; --warn-soft:#2a2110;
    --bad:#fca5a5; --code:#e2e8f0; --code-bg:#0b1020;
    --shadow:0 8px 32px rgba(0,0,0,.45); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--bottom-nav) + env(safe-area-inset-bottom,0px))}
a{color:var(--accent-ink);text-underline-offset:2px}
a:hover{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:6px}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:8px;top:8px;background:var(--paper);padding:10px 14px;z-index:100;border-radius:8px;box-shadow:var(--shadow)}
.app-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,23,42,.04)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.bar-top{width:100%;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--ink);font-size:1.05rem}
.brand span{color:var(--accent)}
.grow{flex:1;min-width:8px}
.progress-wrap{flex:1;min-width:120px;max-width:320px}
.progress-label{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track > span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:99px;transition:width .35s ease}
.icon-btn,.btn{min-height:var(--tap);border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:0 14px;cursor:pointer;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.icon-btn:active,.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn.primary{color:#0f172a}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"],.btn.active{background:var(--soft);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn.icon-only{width:var(--tap);padding:0}
.icon-btn:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{text-decoration:none;color:var(--muted);font-size:.875rem;font-weight:650;padding:8px 14px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.tabs a[aria-current="page"]{background:var(--soft);color:var(--accent-ink);border-color:var(--line)}
.layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100dvh - var(--header-h))}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout.with-curriculum .main-wrap{max-width:920px}
.sidebar{border-right:1px solid var(--line);background:var(--paper);padding:14px;position:sticky;top:var(--header-h);height:calc(100dvh - var(--header-h));overflow:auto;overscroll-behavior:contain}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sidebar-head h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.filters label{font-size:.8rem;font-weight:600;color:var(--muted)}
.filters input,.filters select,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:var(--tap)}
.field{display:block;margin:12px 0}
.phase-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
.mod{margin-bottom:4px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.mod > button{width:100%;text-align:left;background:var(--bg);border:0;padding:12px 14px;cursor:pointer;font-weight:700;font-size:.875rem;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--tap)}
.mod > button::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex-shrink:0}
.mod > button[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:4px}
.mod ul{list-style:none;margin:0;padding:4px 8px 10px;background:var(--paper)}
.mod a{display:flex;align-items:flex-start;gap:8px;text-decoration:none;color:var(--ink);font-size:.875rem;padding:10px 10px;border-radius:8px;line-height:1.35}
.mod a:hover,.mod a[aria-current="true"]{background:var(--soft)}
.mod a[aria-current="true"]{font-weight:700;color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:99px;margin-top:5px;flex-shrink:0;background:var(--line)}
.dot.progress{background:var(--warn)} .dot.done{background:var(--good)} .dot.revision{background:var(--bad)}
.main{padding:20px 20px 48px;width:100%}
.main-inner{max-width:920px;margin:0 auto}
.hero h1,.main h1{font-size:clamp(1.6rem,4.5vw,2.25rem);line-height:1.2;letter-spacing:-.03em;margin:0 0 10px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card-interactive{transition:transform .15s,box-shadow .15s}
.card-interactive:active{transform:scale(.99)}
.kpi{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h2{font-size:1.25rem;margin:28px 0 10px;letter-spacing:-.02em}
h3{font-size:1.05rem;margin:18px 0 8px}
.topic-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--accent-ink)}
.pill.opt{background:var(--warn-soft);color:var(--warn)}
.pill.adv{background:#ede9fe;color:#5b21b6}
html[data-theme="dark"] .pill.adv{background:#312e81;color:#e9d5ff}
pre{background:var(--code-bg);color:var(--code);padding:14px 16px;border-radius:12px;overflow:auto;border:1px solid var(--line);font-size:.8rem;line-height:1.5;-webkit-overflow-scrolling:touch}
.callout{border-left:4px solid var(--accent);background:var(--soft);padding:14px 16px;border-radius:12px;margin:14px 0;line-height:1.55}
.callout.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.callout.good{border-color:var(--good);background:var(--good-soft)}
.toc{font-size:.875rem;display:grid;gap:6px}
.toc a{text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line)}
.toc a:last-child{border:0}
.status-row,.pager{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.status-row .btn{flex:1 1 auto;min-width:min(100%,140px)}
.pager .btn{flex:1 1 45%}
.check label{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:10px;border-radius:10px;background:var(--bg);cursor:pointer;min-height:var(--tap)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:.875rem}
th,td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:12px}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.topic-cards{display:none;gap:10px;margin-top:16px}
.topic-card{display:block;text-decoration:none;color:inherit;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.topic-card strong{display:block;margin-bottom:4px;color:var(--ink)}
.topic-card .muted{font-size:.8rem}
.quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.menu-btn{display:none}
.drawer-backdrop{display:none;opacity:0;transition:opacity .2s}
.bottom-nav{display:none}
.sheet{position:fixed;inset:0;z-index:80;pointer-events:none}
.sheet.show{pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.5);opacity:0;transition:opacity .25s}
.sheet.show .sheet-backdrop{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70dvh;overflow:auto;transform:translateY(100%);transition:transform .28s ease}
.sheet.show .sheet-panel{transform:translateY(0)}
.sheet-panel a,.sheet-panel button{width:100%;text-align:left;margin:4px 0}
.hidden{display:none !important}
.desktop-only{display:block}
.mobile-only{display:none}
.table-desktop{display:block}
@media(max-width:900px){
  :root{--bottom-nav:64px}
  .desktop-only{display:none !important}
  .mobile-only{display:block}
  .table-desktop{display:none}
  .topic-cards{display:grid}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:60;top:0;left:0;height:100dvh;width:min(92vw,340px);padding-top:max(12px,env(safe-area-inset-top));transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .drawer-backdrop.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55;opacity:1}
  .main{padding:16px 14px calc(24px + var(--bottom-nav))}
  .progress-wrap{display:none}
  .progress-mobile{display:block !important;padding:0 14px 8px}
  .tabs{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:4px;box-shadow:0 -4px 24px rgba(15,23,42,.06)}
  .bottom-nav a{flex:1;text-decoration:none;color:var(--muted);font-size:.65rem;font-weight:700;text-align:center;padding:6px 4px;border-radius:10px;min-height:var(--tap);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;max-width:72px}
  .bottom-nav a span{font-size:1.1rem;line-height:1}
  .bottom-nav a[aria-current="page"]{color:var(--accent-ink);background:var(--soft)}
  .status-row .btn{min-width:calc(50% - 4px)}
  .pager{position:sticky;bottom:calc(var(--bottom-nav) + 8px);background:var(--bg);padding:10px 0;margin:20px -4px 0;z-index:5}
}
.progress-mobile{display:none}
@media print {
  .app-header,.sidebar,.noprint,.status-row,.pager,.drawer-backdrop,.bottom-nav,.sheet{display:none !important}
  .layout{display:block}
  .main{max-width:none;padding:0}
  body{background:#fff;color:#000;padding:0}
  a{color:#000;text-decoration:none}
  pre{white-space:pre-wrap}
}
@media (prefers-reduced-motion: reduce) {
  html{scroll-behavior:auto}
  .track > span,.sidebar,.sheet-panel,.drawer-backdrop{transition:none}
}
</style>
</head>
