<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upgrade 2026 — Career documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){
  var key="upgrade2026-progress-v1", mode="system";
  try{mode=JSON.parse(localStorage.getItem(key)||"{}").theme||"system";}catch(e){}
  if(mode!=="light"&&mode!=="dark"&&mode!=="system") mode="system";
  var resolved=mode==="system"?(window.matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"):mode;
  document.documentElement.setAttribute("data-theme",resolved);
  document.documentElement.setAttribute("data-theme-mode",mode);
})();
</script>
<style>
html[data-theme="light"]{
  color-scheme:light;
  --bg:#e8ecf3; --paper:#ffffff; --ink:#0f172a; --muted:#334155; --line:#cbd5e1;
  --accent:#2563eb; --accent-hover:#1d4ed8; --accent-ink:#1e3a8a; --soft:#eff6ff;
  --good:#047857; --good-soft:#ecfdf5; --warn:#9a3412; --warn-soft:#fff7ed;
  --bad:#b91c1c; --code:#0f172a; --code-bg:#f1f5f9; --btn-on-primary:#ffffff;
  --shadow:0 4px 24px rgba(15,23,42,.08);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0e14; --paper:#151b24; --ink:#f8fafc; --muted:#cbd5e1; --line:#334155;
  --accent:#60a5fa; --accent-hover:#93c5fd; --accent-ink:#bfdbfe; --soft:#1e293b;
  --good:#34d399; --good-soft:#064e3b; --warn:#fde68a; --warn-soft:#422006;
  --bad:#fca5a5; --code:#e2e8f0; --code-bg:#0f172a; --btn-on-primary:#0f172a;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
:root{
  --sidebar:300px; --header-h:120px; --bottom-nav:0px; --radius:14px; --tap:44px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(var(--bottom-nav) + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.main-inner,.main-inner section,.main-inner article{color:var(--ink)}
.main-inner h1,.main-inner h2,.main-inner h3,.main-inner p,.main-inner li,.main-inner td,.main-inner th,.main-inner strong{color:inherit}
.main-inner a:not(.btn):not(.topic-card){color:var(--accent-ink)}
a{color:var(--accent-ink);text-underline-offset:2px}
a:hover{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
code,pre{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
code{background:var(--code-bg);padding:.1em .35em;border-radius:6px}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:8px;top:8px;background:var(--paper);padding:10px 14px;z-index:100;border-radius:8px;box-shadow:var(--shadow)}
.app-header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(15,23,42,.04)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.bar-top{width:100%;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;letter-spacing:-.03em;text-decoration:none;color:var(--ink);font-size:1.05rem}
.brand span{color:var(--accent)}
.grow{flex:1;min-width:8px}
.progress-wrap{flex:1;min-width:120px;max-width:320px}
.progress-label{display:flex;justify-content:space-between;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.track > span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:99px;transition:width .35s ease}
.icon-btn,.btn{min-height:var(--tap);border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:0 14px;cursor:pointer;font-weight:600;font-size:.875rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.icon-btn:active,.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--btn-on-primary)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"],.btn.active{background:var(--soft);border-color:var(--accent);color:var(--accent-ink)}
.icon-btn.icon-only{width:var(--tap);padding:0}
.icon-btn:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs a{text-decoration:none;color:var(--muted);font-size:.875rem;font-weight:650;padding:8px 14px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.tabs a[aria-current="page"]{background:var(--soft);color:var(--accent-ink);border-color:var(--line)}
.layout{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:calc(100dvh - var(--header-h))}
.layout.solo{grid-template-columns:minmax(0,1fr)}
.layout.with-curriculum .main-wrap{max-width:920px}
.sidebar{border-right:1px solid var(--line);background:var(--paper);padding:14px;position:sticky;top:var(--header-h);height:calc(100dvh - var(--header-h));overflow:auto;overscroll-behavior:contain}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sidebar-head h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.filters label{font-size:.8rem;font-weight:600;color:var(--muted)}
.filters input,.filters select,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 14px;min-height:var(--tap)}
.field{display:block;margin:12px 0}
.phase-label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
.mod{margin-bottom:4px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.mod > button{width:100%;text-align:left;background:var(--bg);border:0;padding:12px 14px;cursor:pointer;font-weight:700;font-size:.875rem;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:var(--tap)}
.mod > button::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex-shrink:0}
.mod > button[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:4px}
.mod ul{list-style:none;margin:0;padding:4px 8px 10px;background:var(--paper)}
.mod a{display:flex;align-items:flex-start;gap:8px;text-decoration:none;color:var(--ink);font-size:.875rem;padding:10px 10px;border-radius:8px;line-height:1.35}
.mod a:hover,.mod a[aria-current="true"]{background:var(--soft)}
.mod a[aria-current="true"]{font-weight:700;color:var(--accent-ink)}
.dot{width:10px;height:10px;border-radius:99px;margin-top:5px;flex-shrink:0;background:var(--line)}
.dot.progress{background:var(--warn)} .dot.done{background:var(--good)} .dot.revision{background:var(--bad)}
.main{padding:20px 20px 48px;width:100%}
.main-inner{max-width:920px;margin:0 auto}
.hero h1,.main h1{font-size:clamp(1.6rem,4.5vw,2.25rem);line-height:1.2;letter-spacing:-.03em;margin:0 0 10px}
.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card-interactive{transition:transform .15s,box-shadow .15s}
.card-interactive:active{transform:scale(.99)}
.kpi{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
h2{font-size:1.25rem;margin:28px 0 10px;letter-spacing:-.02em}
h3{font-size:1.05rem;margin:18px 0 8px}
.topic-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{font-size:.7rem;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--accent-ink)}
.pill.opt{background:var(--warn-soft);color:var(--warn)}
.pill.adv{background:#ede9fe;color:#5b21b6}
html[data-theme="dark"] .pill.adv{background:#312e81;color:#e9d5ff}
pre{background:var(--code-bg);color:var(--code);padding:14px 16px;border-radius:12px;overflow:auto;border:1px solid var(--line);font-size:.8rem;line-height:1.5;-webkit-overflow-scrolling:touch}
.callout{border-left:4px solid var(--accent);background:var(--soft);padding:14px 16px;border-radius:12px;margin:14px 0;line-height:1.55}
.callout,.callout.warn,.callout.good{color:var(--ink)}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout.good{border-color:var(--good);background:var(--good-soft)}
.toc{font-size:.875rem;display:grid;gap:6px}
.toc a{text-decoration:none;padding:6px 0;border-bottom:1px solid var(--line)}
.toc a:last-child{border:0}
.status-row,.pager{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.status-row .btn{flex:1 1 auto;min-width:min(100%,140px)}
.pager .btn{flex:1 1 45%}
.check label{display:flex;gap:12px;align-items:flex-start;margin:10px 0;padding:10px;border-radius:10px;background:var(--bg);cursor:pointer;min-height:var(--tap)}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex-shrink:0}
table{width:100%;border-collapse:collapse;background:var(--paper);font-size:.875rem}
th,td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:12px}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--bg)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.topic-cards{display:none;gap:10px;margin-top:16px}
.topic-card{display:block;text-decoration:none;color:inherit;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}
.topic-card strong{display:block;margin-bottom:4px;color:var(--ink)}
.topic-card .muted{font-size:.8rem}
.quick-actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.menu-btn{display:none}
.drawer-backdrop{display:none;opacity:0;transition:opacity .2s}
.bottom-nav{display:none}
.sheet{position:fixed;inset:0;z-index:80;pointer-events:none}
.sheet.show{pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.5);opacity:0;transition:opacity .25s}
.sheet.show .sheet-backdrop{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70dvh;overflow:auto;transform:translateY(100%);transition:transform .28s ease}
.sheet.show .sheet-panel{transform:translateY(0)}
.sheet-panel a,.sheet-panel button{width:100%;text-align:left;margin:4px 0}
.hidden{display:none !important}
.desktop-only{display:block}
.mobile-only{display:none}
.table-desktop{display:block}
@media(max-width:900px){
  :root{--bottom-nav:64px}
  .desktop-only{display:none !important}
  .mobile-only{display:block}
  .table-desktop{display:none}
  .topic-cards{display:grid}
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:60;top:0;left:0;height:100dvh;width:min(92vw,340px);padding-top:max(12px,env(safe-area-inset-top));transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .drawer-backdrop.show{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55;opacity:1}
  .main{padding:16px 14px calc(24px + var(--bottom-nav))}
  .progress-wrap{display:none}
  .progress-mobile{display:block !important;padding:0 14px 8px}
  .tabs{display:none}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:4px;box-shadow:0 -4px 24px rgba(15,23,42,.06)}
  .bottom-nav a{flex:1;text-decoration:none;color:var(--muted);font-size:.65rem;font-weight:700;text-align:center;padding:6px 4px;border-radius:10px;min-height:var(--tap);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;max-width:72px}
  .bottom-nav a span{font-size:1.1rem;line-height:1}
  .bottom-nav a[aria-current="page"]{color:var(--accent-ink);background:var(--soft)}
  .bottom-nav .nav-more{flex:1;border:0;background:transparent;color:var(--muted);font-size:.65rem;font-weight:700;flex-direction:column;min-height:var(--tap);max-width:72px;border-radius:10px;font-family:inherit;cursor:pointer}
  .bottom-nav .nav-more span{font-size:1.1rem;line-height:1}
  .status-row .btn{min-width:calc(50% - 4px)}
  .pager{position:sticky;bottom:calc(var(--bottom-nav) + 8px);background:var(--bg);padding:10px 0;margin:20px -4px 0;z-index:5}
}
.progress-mobile{display:none}
@media print {
  .app-header,.sidebar,.noprint,.status-row,.pager,.drawer-backdrop,.bottom-nav,.sheet{display:none !important}
  .layout{display:block}
  .main{max-width:none;padding:0}
  body{background:#fff;color:#000;padding:0}
  a{color:#000;text-decoration:none}
  pre{white-space:pre-wrap}
}
@media (prefers-reduced-motion: reduce) {
  html{scroll-behavior:auto}
  .track > span,.sidebar,.sheet-panel,.drawer-backdrop{transition:none}
}
select option{background:var(--paper);color:var(--ink)}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById("curriculum-data").textContent);
const KEY = "upgrade2026-progress-v1";
const START = "2026-10-18";
const views = ["dashboard","curriculum","plan","projects","interviews","context","continuity","refs"];

function loadState(){
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return blank(); }
}
function blank(){
  return {topics:{}, projects:{}, answers:{}, daily:{}, context:{
    years:"about 4.5", ctc:"7", target:"20", hours:"5", location:"", notice:"",
    note:"Laravel, PHP, intermediate Python, SQL, PostgreSQL, Linux, AWS, REST, and production web apps. JavaScript, React/Vue, MySQL, Nginx, Jenkins, and Docker fundamentals are exposure, not a second career."
  }, theme:"system"};
}
let state = loadState();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); paintProgress(); }
function allTopics(){ return DATA.phases.flatMap(p => p.modules.flatMap(m => m.topics.map(t => Object.assign({phase:p.title, module:m.title, moduleId:m.id}, t)))); }
function topicById(id){ return allTopics().find(t => t.id === id); }
function statusOf(id){ return (state.topics[id] && state.topics[id].status) || ""; }
function daysSince(iso){
  if(!iso) return 0;
  const a = new Date(iso.slice(0,10)+"T00:00:00");
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.floor((b-a)/86400000);
}
function revisionDue(id){
  const row = state.topics[id];
  if(!row) return false;
  if(row.status === "revision") return true;
  if(row.status === "done" && daysSince(row.revisedAt || row.at) >= 14) return true;
  return false;
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inline(s){
  let t = esc(s);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/#([a-z0-9-]+)/g, (m,id) => topicById(id) ? `<a href="#topic/${id}">${esc(topicById(id).title)}</a>` : m);
  return t;
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

function resolveTheme(mode){
  if(mode === "light" || mode === "dark") return mode;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function themeModeLabel(mode){
  if(mode === "light") return "Light";
  if(mode === "dark") return "Dark";
  return "System";
}
function applyTheme(){
  const mode = state.theme === "light" || state.theme === "dark" || state.theme === "system" ? state.theme : "system";
  const resolved = resolveTheme(mode);
  document.documentElement.setAttribute("data-theme", resolved);
  document.documentElement.setAttribute("data-theme-mode", mode);
  let meta = document.querySelector('meta[name="theme-color"]');
  if(!meta){
    meta = document.createElement("meta");
    meta.name = "theme-color";
    document.head.appendChild(meta);
  }
  meta.content = resolved === "dark" ? "#0a0e14" : "#ffffff";
  const label = themeModeLabel(mode);
  const btn = document.getElementById("themeBtn");
  if(btn) btn.textContent = label;
  const mobile = document.getElementById("themeBtnMobile");
  if(mobile) mobile.textContent = "Theme: " + label + " (tap to change)";
}
function setTheme(mode){
  state.theme = mode;
  applyTheme();
  save();
}
function cycleTheme(){
  const order = ["light", "dark", "system"];
  const i = order.indexOf(state.theme);
  setTheme(order[(i + 1) % order.length]);
}
applyTheme();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {

});

function paintProgress(){
  const topics = allTopics();
  const done = topics.filter(t => statusOf(t.id) === "done").length;
  const pct = topics.length ? Math.round(done / topics.length * 100) : 0;
  ["overallPct","overallPctMobile"].forEach(id => { const n = document.getElementById(id); if(n) n.textContent = pct + "% · " + done + "/" + topics.length; });
  ["overallFill","overallFillMobile"].forEach(id => { const n = document.getElementById(id); if(n) n.style.width = pct + "%"; });
  const bar = document.getElementById("overallBar");
  if(bar){ bar.setAttribute("aria-valuenow", String(pct)); bar.setAttribute("aria-label", pct + " percent of topics done"); }
  const box = document.getElementById("moduleBars");
  if(!box) return;
  box.innerHTML = DATA.phases.map(p => p.modules.map(m => {
    const d = m.topics.filter(t => statusOf(t.id) === "done").length;
    const pctx = m.topics.length ? Math.round(d / m.topics.length * 100) : 0;
    return `<div style="margin:8px 0"><div class="progress-label"><span>${esc(m.title)}</span><span>${pctx}%</span></div><div class="track"><span style="width:${pctx}%"></span></div></div>`;
  }).join("")).join("");

function filteredTopics(){
  const q = (document.getElementById("search")?.value || "").trim().toLowerCase();
  const level = document.getElementById("filterLevel")?.value || "";
  const priority = document.getElementById("filterPriority")?.value || "";
  return allTopics().filter(t => {
    if(level && t.level !== level) return false;
    if(priority && t.priority !== priority) return false;
    if(!q) return true;
    const blob = (t.title + " " + t.summary + " " + JSON.stringify(t.blocks)).toLowerCase();
    return blob.includes(q);
  });
}

function currentTopicId(){
  const raw = location.hash.replace(/^#/, "");

  const allow = new Set(filteredTopics().map(t => t.id));

function bind(root){
  root.querySelectorAll("[data-status]").forEach(btn => btn.addEventListener("click", () => {
    const id = location.hash.split("/")[1];
    const status = btn.dataset.status;
    if(!status) delete state.topics[id];
    else state.topics[id] = Object.assign(state.topics[id]||{}, {status, at: new Date().toISOString()});
    save(); route();
  }));
  const revised = root.querySelector("#revisedBtn");
  if(revised) revised.addEventListener("click", () => {
    const id = location.hash.split("/")[1];
    state.topics[id] = Object.assign(state.topics[id]||{status:"done"}, {revisedAt: new Date().toISOString(), at: (state.topics[id]&&state.topics[id].at) || new Date().toISOString()});
    save(); route();
  });
  root.querySelectorAll("[data-daily]").forEach(box => box.addEventListener("change", () => {
    const today = new Date().toISOString().slice(0,10);
    state.daily[today] = state.daily[today] || {};
    state.daily[today][box.dataset.daily] = box.checked;
    save();
  }));
  root.querySelectorAll("[data-context]").forEach(el => el.addEventListener("change", () => {
    state.context[el.dataset.context] = el.value;
    save();
  }));
  root.querySelectorAll("[data-project]").forEach(el => el.addEventListener("change", () => {
    state.projects[el.dataset.project] = el.value;
    save(); route();
  }));
  root.querySelectorAll("[data-answer]").forEach(el => el.addEventListener("input", () => {
    state.answers[el.dataset.answer] = el.value;
    save();
  }));
  const reset = root.querySelector("#resetBtn");
  if(reset) reset.addEventListener("click", () => {
    if(!confirm("Erase topic progress, project ticks, answers, and context stored in this browser?")) return;
    const theme = state.theme;
    localStorage.removeItem(KEY);
    state = blank();
    state.theme = theme;
    save(); route();
  });
}

  const h = location.hash.replace(/^#/,"") || "dashboard";
  if(h === "curriculum" || h.startsWith("topic/")){
    const inner = document.getElementById("mainInner");
    if(inner && h === "curriculum") inner.innerHTML = curriculumHome();
  }
}));
function openDrawer(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("backdrop").classList.add("show");
  document.getElementById("menuBtn").setAttribute("aria-expanded","true");
  document.body.style.overflow = "hidden";
}
function closeDrawer(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("backdrop").classList.remove("show");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  document.body.style.overflow = "";
}
function openSheet(){
  const s = document.getElementById("moreSheet");
  s.classList.add("show");
  s.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  const s = document.getElementById("moreSheet");
  s.classList.remove("show");
  s.setAttribute("aria-hidden","true");
  if(!document.getElementById("sidebar").classList.contains("open")) document.body.style.overflow = "";
}
document.getElementById("menuBtn").addEventListener("click", () => {
  const sb = document.getElementById("sidebar");
  if(sb.classList.contains("open")) closeDrawer();
  else openDrawer();
});
document.getElementById("closeSidebar")?.addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);
document.getElementById("sidebar").addEventListener("click", e => { if(e.target.closest("a")) closeDrawer(); });
document.getElementById("moreBtn")?.addEventListener("click", openSheet);
document.getElementById("moreBtnBottom")?.addEventListener("click", openSheet);
document.getElementById("sheetBackdrop")?.addEventListener("click", closeSheet);
document.getElementById("closeSheet")?.addEventListener("click", closeSheet);
document.querySelectorAll("#moreSheet a").forEach(a => a.addEventListener("click", closeSheet));
document.getElementById("themeBtnMobile")?.addEventListener("click", () => { cycleTheme(); closeSheet(); });
document.getElementById("exportBtnMobile")?.addEventListener("click", () => { document.getElementById("exportBtn").click(); closeSheet(); });
document.getElementById("importBtnMobile")?.addEventListener("click", () => { document.getElementById("importBtn").click(); closeSheet(); });
document.getElementById("printBtnMobile")?.addEventListener("click", () => { window.print(); closeSheet(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeDrawer(); closeSheet(); }
  if(e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "SELECT"){
    e.preventDefault(); location.hash = "#curriculum"; setTimeout(() => document.getElementById("search")?.focus(), 50);
  }
});
window.addEventListener("resize", syncHeader);
window.addEventListener("hashchange", route);
renderNav();
route();
</script>
</body>
</html>
