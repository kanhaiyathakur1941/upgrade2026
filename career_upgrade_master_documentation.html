//docs.python.org/3/", "why": "Language, stdlib, typing."}, {"title": "Python tutorial", "url": "https://docs.python.org/3/tutorial/", "why": "Skip if diagnostic is fluent; use as lookup."}, {"title": "FastAPI", "url": "https://fastapi.tiangolo.com/", "why": "Primary web framework for new work."}, {"title": "Pydantic", "url": "https://docs.pydantic.dev/", "why": "Request and response models."}, {"title": "pytest", "url": "https://docs.pytest.org/", "why": "Tests."}, {"title": "SQLAlchemy", "url": "https://docs.sqlalchemy.org/", "why": "ORM and Core."}, {"title": "PostgreSQL", "url": "https://www.postgresql.org/docs/", "why": "SQL and pg internals."}, {"title": "Redis", "url": "https://redis.io/docs/", "why": "Cache and simple queues."}, {"title": "Docker", "url": "https://docs.docker.com/", "why": "Images and Compose."}, {"title": "GitHub Actions", "url": "https://docs.github.com/actions", "why": "CI."}, {"title": "AWS documentation", "url": "https://docs.aws.amazon.com/", "why": "IAM, EC2, S3, RDS, SQS, SNS, CloudWatch."}, {"title": "Kubernetes", "url": "https://kubernetes.io/docs/", "why": "Optional after Docker."}, {"title": "Terraform", "url": "https://developer.hashicorp.com/terraform/docs", "why": "Optional IaC."}, {"title": "OpenTelemetry", "url": "https://opentelemetry.io/docs/", "why": "Traces and metrics ideas."}, {"title": "OpenAI API", "url": "https://platform.openai.com/docs/", "why": "LLM HTTP API."}, {"title": "Model Context Protocol", "url": "https://modelcontextprotocol.io/", "why": "Tool servers, later."}, {"title": "Hugging Face docs", "url": "https://huggingface.co/docs", "why": "Embeddings and PEFT literacy."}, {"title": "pgvector", "url": "https://github.com/pgvector/pgvector", "why": "Vectors in PostgreSQL."}, {"title": "OWASP", "url": "https://owasp.org/", "why": "Web risks."}, {"title": "MDN HTTP", "url": "https://developer.mozilla.org/en-US/docs/Web/HTTP", "why": "Protocol."}, {"title": "Apache Kafka", "url": "https://kafka.apache.org/documentation/", "why": "After the apply gate, if a role needs logs at that scale."}, {"title": "roadmap.sh system design", "url": "https://roadmap.sh/system-design", "why": "Map, not a substitute for your six designs."}, {"title": "roadmap.sh AI engineer", "url": "https://roadmap.sh/ai-engineer", "why": "Application track, not ML research."}, {"title": "Public v4 roadmap", "url": "https://kanhaiyathakur1941.github.io/careerupgrade/", "why": "Outline only. This folder is the lesson body."}], "continuityHtml": "\n\u003csection>\n\u003ch1>Previous course continuity\u003c/h1>\n\u003cp>Inspected on 18 October 2026. Existing files were not overwritten. Completion boxes live in other browsers' localStorage, so \u003cstrong>nothing is pre-ticked here\u003c/strong>.\u003c/p>\n\n\u003cdiv class=\"callout warn\">\u003cstrong>Discrepancy.\u003c/strong> The public v4 page can look like a finished curriculum. It is an outline with checklists. There is no local Python Day 1–Day 5 lesson series. Accenture Days 1–14 are a PHP interview sprint dated 5–18 October 2026. Those two tracks are different. Upgrade 2026 starts at the Python diagnostic, not at Accenture day 15.\u003c/div>\n\n\u003ch2>Files inspected\u003c/h2>\n\u003cdiv class=\"scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>What it is\u003c/th>\u003cth>Progress evidence\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>Desktop/careerupgrade/index.html\u003c/td>\u003ctd>Roadmap v4, 32 weeks, one document-assistant product, apply at week 24\u003c/td>\u003ctd>Checkboxes; not readable from disk. Treat as 0% until you import an export.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Downloads/career_upgrade_roadmap_v3.html and v2\u003c/td>\u003ctd>Earlier 40-week outlines\u003c/td>\u003ctd>v4 already lists what it kept.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Desktop/careerupgrade/Accenture/accenture-fullstack-roadmap.html\u003c/td>\u003ctd>Days 1–14 plus weeks 3–8 for Accenture PHP Full Stack Engineer\u003c/td>\u003ctd>Day 1 fit map through Day 5 Laravel lifecycle, then Days 6–14 REST, SQL, queues, cache, JWT, OAuth2, OpenAPI, serialization, checkpoint. Ticks unverified.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Accenture/accenture-gap-analysis.md and resume HTML\u003c/td>\u003ctd>Do-not-claim list, Gomilestone from June 2022, 2018 training separate\u003c/td>\u003ctd>Rules carried into the context page. Degree B.Tech vs older BCA PDFs still unresolved in that note.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PyCharmMiscProject/abstraction.py\u003c/td>\u003ctd>Car class with move/stop\u003c/td>\u003ctd>Shows basic OOP. Not completion of the OOP module.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>abstractex.py\u003c/td>\u003ctd>ABC example fully commented out\u003c/td>\u003ctd>ABC is open.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>script.py\u003c/td>\u003ctd>Edit distance; prints 1 for cat/cats\u003c/td>\u003ctd>DP beginner evidence. Keep the idea, re-test in the new repo.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>knapsackzeroonebyset.py\u003c/td>\u003ctd>Empty def plus commented solution\u003c/td>\u003ctd>Knapsack is not done.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Nursery Laravel workspace\u003c/td>\u003ctd>Unrelated product\u003c/td>\u003ctd>Ignored for this plan.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\n\u003ch2>What was carried over\u003c/h2>\n\u003cul>\n\u003cli>One repository, one multi-tenant document assistant.\u003c/li>\n\u003cli>Laravel as proof of production; Python as the language of new systems.\u003c/li>\n\u003cli>No ML Engineer track. Small transformer literacy only.\u003c/li>\n\u003cli>Kafka and Kubernetes after a working deploy.\u003c/li>\n\u003cli>Apply before the last week of a long outline. This plan applies from week 3 for Laravel-plus-Python roles, and treats a defendable RAG system as the ₹30 LPA conversation, not as a gate that delays every application.\u003c/li>\n\u003cli>Accenture PHP days stay in Desktop/careerupgrade/Accenture. Use them if that posting is still live. They do not mark Python topics done.\u003c/li>\n\u003c/ul>\n\n\u003ch2>What was added or corrected\u003c/h2>\n\u003cul>\n\u003cli>Lesson bodies with examples, not only week titles.\u003c/li>\n\u003cli>₹20 LPA in 3–6 months as the near target, with ₹15 LPA as the lower band of the same search.\u003c/li>\n\u003cli>v4's \"apply at week 24\" kept as the RAG/₹30 LPA gate, not as the first time you may talk to companies.\u003c/li>\n\u003cli>Diagnostic as lesson one, because no Python day files existed.\u003c/li>\n\u003cli>Interview questions on their own tab.\u003c/li>\n\u003cli>Progress bars for the whole curriculum, each phase, each module, and projects.\u003c/li>\n\u003c/ul>\n\n\u003ch2>Assumptions\u003c/h2>\n\u003cul>\n\u003cli>About 5 hours on days you actually have them. The calendar still lists days so you can slide, not skip.\u003c/li>\n\u003cli>Current CTC about ₹7 LPA is what you stated. Compensation is never guaranteed by a study file.\u003c/li>\n\u003cli>GitHub URL still missing until you add one in context notes.\u003c/li>\n\u003c/ul>\n\n\u003ch2>Thinner lessons (still real, shorter than the 90-day core)\u003c/h2>\n\u003cul>\n\u003cli>Optional: Terraform, Kubernetes, MCP, LoRA comparison, Kafka (reference only until needed).\u003c/li>\n\u003cli>Advanced system designs for ecommerce go as deep as your Fit Paradox/Groplus facts allow. No invented metrics.\u003c/li>\n\u003cli>You can lengthen any topic later by editing source/*.py and running python3 source/build.py.\u003c/li>\n\u003c/ul>\n\n\u003ch2>Next recommended lesson\u003c/h2>\n\u003cp>\u003ca href=\"#topic/py-diagnostic\">py-diagnostic\u003c/a> — 45 minutes, closed book, 18 October 2026. Then functions or classes as the diagnostic says.\u003c/p>\n\u003c/section>\n"}</script>
<script>
const DATA = JSON.parse(document.getElementById("curriculum-data").textContent);
const KEY = "upgrade2026-progress-v1";
const START = "2026-10-18";
const views = ["dashboard","curriculum","plan","projects","interviews","context","continuity","refs"];

function loadState(){
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); }
  catch { return blank(); }
}
function blank(){
  return {topics:{}, projects:{}, answers:{}, daily:{}, context:{
    years:"about 4.5", ctc:"7", target:"20", hours:"5", location:"", notice:"",
    note:"Laravel, PHP, intermediate Python, SQL, PostgreSQL, Linux, AWS, REST, and production web apps. JavaScript, React/Vue, MySQL, Nginx, Jenkins, and Docker fundamentals are exposure, not a second career."
  }, theme:"light"};
}
let state = loadState();
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); paintProgress(); }
function allTopics(){ return DATA.phases.flatMap(p => p.modules.flatMap(m => m.topics.map(t => Object.assign({phase:p.title, module:m.title, moduleId:m.id}, t)))); }
function topicById(id){ return allTopics().find(t => t.id === id); }
function statusOf(id){ return (state.topics[id] && state.topics[id].status) || ""; }
function daysSince(iso){
  if(!iso) return 0;
  const a = new Date(iso.slice(0,10)+"T00:00:00");
  const b = new Date(); b.setHours(0,0,0,0);
  return Math.floor((b-a)/86400000);
}
function revisionDue(id){
  const row = state.topics[id];
  if(!row) return false;
  if(row.status === "revision") return true;
  if(row.status === "done" && daysSince(row.revisedAt || row.at) >= 14) return true;
  return false;
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inline(s){
  let t = esc(s);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/#([a-z0-9-]+)/g, (m,id) => topicById(id) ? `<a href="#topic/${id}">${esc(topicById(id).title)}</a>` : m);
  return t;
}
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

function setTheme(theme){
  state.theme = theme;
  document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
  save();
}
document.documentElement.dataset.theme = state.theme === "dark" ? "dark" : "light";

function paintProgress(){
  const topics = allTopics();
  const done = topics.filter(t => statusOf(t.id) === "done").length;
  const pct = topics.length ? Math.round(done / topics.length * 100) : 0;
  ["overallPct","overallPctMobile"].forEach(id => { const n = document.getElementById(id); if(n) n.textContent = pct + "% · " + done + "/" + topics.length; });
  ["overallFill","overallFillMobile"].forEach(id => { const n = document.getElementById(id); if(n) n.style.width = pct + "%"; });
  const bar = document.getElementById("overallBar");
  if(bar){ bar.setAttribute("aria-valuenow", String(pct)); bar.setAttribute("aria-label", pct + " percent of topics done"); }
  const box = document.getElementById("moduleBars");
  if(!box) return;
  box.innerHTML = DATA.phases.map(p => p.modules.map(m => {
    const d = m.topics.filter(t => statusOf(t.id) === "done").length;
    const pctx = m.topics.length ? Math.round(d / m.topics.length * 100) : 0;
    return `<div style="margin:8px 0"><div class="progress-label"><span>${esc(m.title)}</span><span>${pctx}%</span></div><div class="track"><span style="width:${pctx}%"></span></div></div>`;
  }).join("")).join("");
}

function filteredTopics(){
  const q = (document.getElementById("search")?.value || "").trim().toLowerCase();
  const level = document.getElementById("filterLevel")?.value || "";
  const priority = document.getElementById("filterPriority")?.value || "";
  return allTopics().filter(t => {
    if(level && t.level !== level) return false;
    if(priority && t.priority !== priority) return false;
    if(!q) return true;
    const blob = (t.title + " " + t.summary + " " + JSON.stringify(t.blocks)).toLowerCase();
    return blob.includes(q);
  });
}

function currentTopicId(){
  const raw = location.hash.replace(/^#/, "");
  if(!raw.startsWith("topic/")) return "";
  return decodeURIComponent(raw.split("/")[1] || "");
}

function renderNav(){
  const allow = new Set(filteredTopics().map(t => t.id));
  const tree = document.getElementById("navTree");
  const open = state.openModules || {};
  const activeId = currentTopicId();
  tree.innerHTML = DATA.phases.map(p => {
    const mods = p.modules.map(m => {
      const items = m.topics.filter(t => allow.has(t.id));
      if(!items.length) return "";
      const hasActive = items.some(t => t.id === activeId);
      const isOpen = hasActive || open[m.id] !== false;
      return `<div class="mod"><button type="button" aria-expanded="${isOpen}" data-mod="${m.id}">${esc(m.title)}</button>
        <ul class="${isOpen ? "" : "hidden"}">${items.map(t => {
          const st = statusOf(t.id);
          const cur = t.id === activeId ? ' aria-current="true"' : "";
          return `<li><a href="#topic/${t.id}"${cur}><span class="dot ${st}"></span><span>${esc(t.title)}</span></a></li>`;
        }).join("")}</ul></div>`;
    }).join("");
    return mods ? `<p class="phase-label">${esc(p.title)}</p>${mods}` : "";
  }).join("");
  tree.querySelectorAll("[data-mod]").forEach(btn => btn.addEventListener("click", () => {
    state.openModules = state.openModules || {};
    const id = btn.dataset.mod;
    const expanded = btn.getAttribute("aria-expanded") === "true";
    state.openModules[id] = !expanded;
    save(); renderNav();
  }));
}

function setNavHighlight(name){
  const map = {dashboard:"dashboard", curriculum:"curriculum", plan:"plan", projects:"projects", interviews:"interviews", context:"context", continuity:"continuity", refs:"refs"};
  const key = map[name] || "dashboard";
  document.querySelectorAll("[data-nav]").forEach(el => {
    const n = el.getAttribute("data-nav");
    const on = n === key || (key === "curriculum" && n === "curriculum");
    el.setAttribute("aria-current", on ? "page" : "false");
  });
}

function syncHeader(){
  const h = document.getElementById("appHeader");
  if(h) document.documentElement.style.setProperty("--header-h", h.offsetHeight + "px");
}

function route(){
  const raw = location.hash.replace(/^#/, "") || "dashboard";
  const [head, encoded] = raw.split("/");
  const arg = encoded ? decodeURIComponent(encoded) : "";
  const name = head === "topic" ? "curriculum" : (views.includes(head) ? head : "dashboard");
  const showLessonNav = name === "curriculum";
  setNavHighlight(name);
  document.querySelectorAll(".tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("data-nav") === name ? "page" : "false"));
  const layout = document.getElementById("layout");
  layout.classList.toggle("solo", !showLessonNav);
  layout.classList.toggle("with-curriculum", showLessonNav);
  const sidebar = document.getElementById("sidebar");
  sidebar.classList.toggle("hidden", !showLessonNav);
  const menuBtn = document.getElementById("menuBtn");
  menuBtn.classList.toggle("hidden", !showLessonNav);
  closeDrawer();
  closeSheet();
  const main = document.getElementById("mainInner");
  if(head === "topic" && topicById(arg)) main.innerHTML = topicHtml(topicById(arg));
  else if(name === "dashboard") main.innerHTML = dashboardHtml();
  else if(name === "curriculum") main.innerHTML = curriculumHome();
  else if(name === "plan") main.innerHTML = planHtml();
  else if(name === "projects") main.innerHTML = projectsHtml();
  else if(name === "interviews") main.innerHTML = interviewsHtml(arg);
  else if(name === "context") main.innerHTML = contextHtml();
  else if(name === "continuity") main.innerHTML = DATA.continuityHtml;
  else if(name === "refs") main.innerHTML = refsHtml();
  else main.innerHTML = dashboardHtml();
  bind(main);
  renderNav();
  paintProgress();
  syncHeader();
  window.scrollTo(0, 0);
  document.getElementById("main").focus({preventScroll:true});
}

function counts(){
  const topics = allTopics();
  return {
    total: topics.length,
    done: topics.filter(t => statusOf(t.id)==="done").length,
    progress: topics.filter(t => statusOf(t.id)==="progress").length,
    revision: topics.filter(t => revisionDue(t.id)).length,
    left: topics.filter(t => statusOf(t.id)!=="done").length
  };
}

function dashboardHtml(){
  const c = counts();
  const essential = allTopics().filter(t => t.priority==="essential");
  const ed = essential.filter(t => statusOf(t.id)==="done").length;
  const ep = essential.length ? Math.round(ed/essential.length*100) : 0;
  const due = allTopics().filter(t => revisionDue(t.id));
  const day = studyDay();
  return `<section class="view">
    <p class="pill">Next lesson is unverified until you pass it</p>
    <h1>Dashboard</h1>
    <p class="muted">Nothing is marked done because an old roadmap mentioned it. Progress is only what you set in this browser.</p>
    <div class="quick-actions noprint">
      <a class="btn primary" href="#topic/py-diagnostic">Continue: diagnostic</a>
      <a class="btn" href="#curriculum">Browse curriculum</a>
      <a class="btn" href="#plan">Today’s plan</a>
    </div>
    <div class="grid">
      <div class="card"><div class="kpi">${c.done}</div><div class="muted">Done</div></div>
      <div class="card"><div class="kpi">${c.progress}</div><div class="muted">In progress</div></div>
      <div class="card"><div class="kpi">${c.left}</div><div class="muted">Not done</div></div>
      <div class="card"><div class="kpi">${c.revision}</div><div class="muted">Revision due</div></div>
    </div>
    <h2>Essential path</h2>
    <div class="progress-label"><span>Essential topics done</span><span>${ep}% · ${ed}/${essential.length}</span></div>
    <div class="track" style="margin:6px 0 12px"><span style="width:${ep}%"></span></div>
    ${DATA.phases.map(p => {
      const ts = p.modules.flatMap(m => m.topics);
      const d = ts.filter(t => statusOf(t.id)==="done").length;
      const pct = ts.length ? Math.round(d/ts.length*100) : 0;
      return `<div class="progress-label"><span>${esc(p.title)}</span><span>${pct}%</span></div><div class="track" style="margin:4px 0 10px"><span style="width:${pct}%"></span></div>`;
    }).join("")}
    <div class="callout good"><strong>Study day ${day.n} · ${day.date}.</strong> ${inline(day.text)} Open <a href="#topic/py-diagnostic">the diagnostic</a> if you have not passed it. Applications start in week 3, not after the last project.</div>
    <h2>Today’s 5-hour checklist</h2>
    <div class="card" id="dailyCard">${dailyChecks()}</div>
    <h2>Revision</h2>
    ${due.length ? `<ul>${due.map(t => `<li><a href="#topic/${t.id}">${esc(t.title)}</a> <span class="muted">${esc(statusOf(t.id)||"done")}</span></li>`).join("")}</ul>` : `<p>No revision flags yet. A done topic asks for revision after 14 days.</p>`}
    <p class="noprint"><button class="btn" id="resetBtn" type="button">Reset all progress</button></p>
  </section>`;
}
function studyDay(){
  const start = new Date(START+"T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  const n = Math.max(1, Math.floor((now-start)/86400000)+1);
  const row = DATA.plan.find(d => d.day === Math.min(n, 90)) || DATA.plan[DATA.plan.length-1];
  return {n, date: now.toLocaleDateString(undefined,{weekday:"long", day:"numeric", month:"short", year:"numeric"}), text: row ? row.focus : "Keep the repo moving."};
}
function dailyChecks(){
  const today = new Date().toISOString().slice(0,10);
  const saved = state.daily[today] || {};
  const items = [
    ["learn","90 min — lesson, official doc plus the page for today"],
    ["build","90 min — code in the document-assistant repo"],
    ["drill","45 min — one SQL or DSA pattern, spoken aloud"],
    ["revise","30 min — explain yesterday without notes"],
    ["track","15 min — mark the topic and one application note if it is week 3+"]
  ];
  return items.map(([id,label]) => `<div class="check"><label><input type="checkbox" data-daily="${id}" ${saved[id]?"checked":""}> ${esc(label)}</label></div>`).join("") + `<p class="muted">Saved for ${esc(today)} only. Yesterday’s list resets.</p>`;
}
function curriculumHome(){
  const rows = filteredTopics();
  return `<section><h1>Curriculum</h1><p class="muted">${rows.length} topics match your filters. On phone, use the cards below or tap ☰ for the lesson menu.</p>
    <div class="topic-cards mobile-only">
    ${rows.map(t => `<a class="topic-card card-interactive" href="#topic/${t.id}"><strong>${esc(t.title)}</strong><span class="muted">${esc(t.module)} · ${esc(t.level)} · ${t.minutes} min</span></a>`).join("")}
    </div>
    <div class="scroll table-desktop"><table><thead><tr><th>Topic</th><th>Level</th><th>Priority</th><th>Minutes</th></tr></thead><tbody>
    ${rows.map(t => `<tr><td><a href="#topic/${t.id}">${esc(t.title)}</a><div class="muted">${esc(t.module)}</div></td><td>${esc(t.level)}</td><td>${esc(t.priority)}</td><td>${t.minutes}</td></tr>`).join("")}
    </tbody></table></div></section>`;
}
function topicHtml(t){
  const idx = allTopics().findIndex(x => x.id === t.id);
  const prev = allTopics()[idx-1];
  const next = allTopics()[idx+1];
  const toc = (t.blocks||[]).map(b => `<a href="#${slug(b.h)}">${esc(b.h)}</a>`).join("");
  const body = (t.blocks||[]).map(b => `<section id="${slug(b.h)}"><h2>${esc(b.h)}</h2>
    ${(b.p||[]).map(p => `<p>${inline(p)}</p>`).join("")}
    ${b.ul ? `<ul>${b.ul.map(li => `<li>${inline(li)}</li>`).join("")}</ul>` : ""}
    ${b.ol ? `<ol>${b.ol.map(li => `<li>${inline(li)}</li>`).join("")}</ol>` : ""}
    ${b.code ? `<pre><code>${esc(b.code)}</code></pre>` : ""}
    ${b.out ? `<p class="callout"><strong>Expected.</strong> ${inline(b.out)}</p>` : ""}
  </section>`).join("");
  const st = statusOf(t.id);
  return `<article>
    <p class="muted">${esc(t.phase)} · ${esc(t.module)}</p>
    <div class="topic-head"><h1 id="${t.id}">${esc(t.title)}</h1></div>
    <div class="meta">
      <span class="pill">${esc(t.level)}</span>
      <span class="pill ${t.priority==="optional"?"opt":""} ${t.priority==="advanced"?"adv":""}">${esc(t.priority)}</span>
      <span class="pill">${t.minutes} min</span>
      <span class="pill">ID ${esc(t.id)}</span>
    </div>
    <p>${inline(t.summary)}</p>
    <nav class="toc card" aria-label="On this page">${toc}</nav>
    <div class="status-row noprint" role="group" aria-label="Topic status">
      ${["","progress","done","revision"].map(s => `<button class="btn${st===s?" active":""}" data-status="${s}" aria-pressed="${st===s}">${s? (s==="progress"?"In progress": s==="done"?"Done":"Revision") : "Not started"}</button>`).join("")}
      <button class="btn ghost" type="button" id="revisedBtn">Revised today</button>
    </div>
    ${body}
    <div class="pager noprint">
      ${prev ? `<a class="btn" href="#topic/${prev.id}">Previous: ${esc(prev.title)}</a>` : ""}
      ${next ? `<a class="btn" href="#topic/${next.id}">Next: ${esc(next.title)}</a>` : ""}
      <a class="btn" href="#interviews">Interview tab</a>
    </div>
  </article>`;
}
function planHtml(){
  return `<section><h1>Study plan</h1>
    <div class="callout warn"><strong>Market frame.</strong> ₹20 LPA in 3–6 months is a hiring target for a developer who already ships Laravel and can defend a Python API. It is not guaranteed by finishing this file. ₹30 LPA waits until the document assistant, including retrieval and evals, is explainable. Do not wait for week 24 of the old roadmap before you apply.</div>
    <h2>Daily 5-hour template</h2>
    <ol>
      <li>90 minutes — one topic. Read the official page linked on it, then this lesson.</li>
      <li>90 minutes — implement that idea in the one repository.</li>
      <li>30 minutes — break. Leave the desk.</li>
      <li>45 minutes — SQL or a DSA pattern, with the complexity said out loud.</li>
      <li>30 minutes — revise yesterday with no notes.</li>
      <li>15 minutes — checklist, and from week 3 a short application log.</li>
    </ol>
    <p>If the code is unfinished, do not open a new theory topic.</p>
    <h2>First 14 days, from 18 October 2026</h2>
    ${planTable(DATA.plan.filter(d => d.day <= 14))}
    <h2>30-day close</h2>
    ${planTable(DATA.plan.filter(d => d.day > 14 && d.day <= 30))}
    <h2>Days 31–90</h2>
    ${planTable(DATA.plan.filter(d => d.day > 30))}
    <h2>After day 90</h2>
    <ul>${DATA.later.map(x => `<li>${inline(x)}</li>`).join("")}</ul>
  </section>`;
}
function planTable(rows){
  return `<div class="scroll"><table><thead><tr><th>Day</th><th>Focus</th><th>Build</th></tr></thead><tbody>${rows.map(d => `<tr><td>${d.day}<div class="muted">${esc(d.date||"")}</div></td><td>${inline(d.focus)}</td><td>${inline(d.build)}</td></tr>`).join("")}</tbody></table></div>`;
}
function projectsHtml(){
  return `<section><h1>Project ladder</h1><p>One repository: a multi-tenant document assistant. Each project is a milestone of that repo. Python for new code. Laravel is the comparison, not the new implementation.</p>
  ${DATA.projects.map(p => {
    const st = state.projects[p.id] || "";
    return `<article class="card" style="margin:12px 0" id="${p.id}"><h2>${esc(p.title)}</h2><p>${inline(p.problem)}</p>
      <label>Status <select data-project="${p.id}">
        <option value="" ${st===""?"selected":""}>Not started</option>
        <option value="progress" ${st==="progress"?"selected":""}>In progress</option>
        <option value="done" ${st==="done"?"selected":""}>Done</option>
      </select></label>
      ${(p.blocks||[]).map(b => `<h3>${esc(b.h)}</h3>${(b.p||[]).map(x=>`<p>${inline(x)}</p>`).join("")}${b.ul?`<ul>${b.ul.map(li=>`<li>${inline(li)}</li>`).join("")}</ul>`:""}${b.code?`<pre><code>${esc(b.code)}</code></pre>`:""}`).join("")}
    </article>`;
  }).join("")}
  <p class="muted">Done ${Object.values(state.projects).filter(s=>s==="done").length} / ${DATA.projects.length}</p>
  <div class="track"><span style="width:${Math.round(Object.values(state.projects).filter(s=>s==="done").length / DATA.projects.length * 100)}%"></span></div>
  </section>`;
}
function interviewsHtml(cat){
  const cats = [...new Set(DATA.interviews.map(q => q.cat))];
  const list = DATA.interviews.filter(q => !cat || q.cat === cat);
  return `<section><h1>Interview questions</h1>
    <p>This is a separate tab from the lessons. Write answers in your own words. They stay in this browser.</p>
    <div class="status-row">${cats.map(c => `<a class="btn" href="#interviews/${encodeURIComponent(c)}">${esc(c)}</a>`).join("")}<a class="btn" href="#interviews">All</a></div>
    ${list.map(q => `<article class="card" style="margin:10px 0"><h2>${esc(q.q)}</h2><p class="muted">${esc(q.cat)} · ${esc(q.level)}</p><p>${inline(q.hint)}</p>
      <label class="field">Your answer<textarea data-answer="${esc(q.id)}" rows="5">${esc(state.answers[q.id]||"")}</textarea></label>
      ${q.topic ? `<p><a href="#topic/${q.topic}">Related lesson</a></p>` : ""}
    </article>`).join("")}
  </section>`;
}

  const c = state.context || {};
  const fields = [["years","Years shipping software"],["ctc","Current CTC, LPA"],["target","Target ask, LPA"],["hours","Hours you can protect"],["location","City / relocation"],["notice","Notice period"]];
  return `<section><h1>Personal context</h1><p>Edit this. It is the brief the rest of the plan assumes. Saving stays on this computer.</p>
    ${fields.map(([k,label]) => `<label class="field">${esc(label)}<input data-context="${k}" value="${esc(c[k]||"")}"></label>`).join("")}
    <label class="field">Notes<textarea data-context="note" rows="6">${esc(c.note||"")}</textarea></label>
    <div class="callout"><strong>Do not claim</strong> production JWT, OAuth2, OpenAPI, Spring, Kubernetes administration, or a finished RAG system until you have built them. Gomilestone PHP/Laravel from June 2022 is the job. The 2018 stint was training. August 2018–May 2022 needs a true sentence you write yourself.</div>
    <h2>How this target was chosen</h2>
    <ul>
      <li>₹15–20 LPA in months 1–6 is the screen you can reach by pairing shipped Laravel work with a tested FastAPI service.</li>
      <li>₹20–25 LPA in that same window needs the API deployed and one LLM endpoint you can debug: timeouts, structured output, cost.</li>
      <li>₹30 LPA is a later conversation, after retrieval, citations, tenant filters, and an eval file are real.</li>
      <li>ML Engineer preparation is not this track.</li>
    </ul>

}
function refsHtml(){
  return `<section><h1>Official references</h1><p>Primary sources. YouTube can sit beside a doc, not instead of it.</p><ul>${DATA.refs.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a> — ${esc(r.why)}</li>`).join("")}</ul>
    <h2>How to use this file</h2>
    <ul>
      <li>Open <code>career_upgrade_master_documentation.html</code> in a browser. No server.</li>
      <li>Start at the diagnostic. Accenture day 15 is a different course.</li>
      <li>Export JSON after a study week. Import restores this browser, or another one.</li>
      <li>To change a lesson later, edit <code>source/</code> and run <code>python3 source/build.py</code> from the Upgrade2026 folder.</li>
    </ul>
  </section>`;
}

function bind(root){
  root.querySelectorAll("[data-status]").forEach(btn => btn.addEventListener("click", () => {
    const id = location.hash.split("/")[1];
    const status = btn.dataset.status;
    if(!status) delete state.topics[id];
    else state.topics[id] = Object.assign(state.topics[id]||{}, {status, at: new Date().toISOString()});
    save(); route();
  }));
  const revised = root.querySelector("#revisedBtn");
  if(revised) revised.addEventListener("click", () => {
    const id = location.hash.split("/")[1];
    state.topics[id] = Object.assign(state.topics[id]||{status:"done"}, {revisedAt: new Date().toISOString(), at: (state.topics[id]&&state.topics[id].at) || new Date().toISOString()});
    save(); route();
  });
  root.querySelectorAll("[data-daily]").forEach(box => box.addEventListener("change", () => {
    const today = new Date().toISOString().slice(0,10);
    state.daily[today] = state.daily[today] || {};
    state.daily[today][box.dataset.daily] = box.checked;
    save();
  }));
  root.querySelectorAll("[data-context]").forEach(el => el.addEventListener("change", () => {
    state.context[el.dataset.context] = el.value;
    save();
  }));
  root.querySelectorAll("[data-project]").forEach(el => el.addEventListener("change", () => {
    state.projects[el.dataset.project] = el.value;
    save(); route();
  }));
  root.querySelectorAll("[data-answer]").forEach(el => el.addEventListener("input", () => {
    state.answers[el.dataset.answer] = el.value;
    save();
  }));
  const reset = root.querySelector("#resetBtn");
  if(reset) reset.addEventListener("click", () => {
    if(!confirm("Erase topic progress, project ticks, answers, and context stored in this browser?")) return;
    const theme = state.theme;
    localStorage.removeItem(KEY);
    state = blank();
    state.theme = theme;
    save(); route();
  });
}

document.getElementById("themeBtn").addEventListener("click", () => setTheme(state.theme === "dark" ? "light" : "dark"));
document.getElementById("exportBtn").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "upgrade2026-progress.json";
  a.click();
  URL.revokeObjectURL(a.href);
});
document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change", () => {
  const file = document.getElementById("importFile").files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const next = JSON.parse(String(reader.result));
      if(!next || typeof next !== "object") throw new Error("bad");
      state = Object.assign(blank(), next);
      save(); route();
    } catch { alert("That file is not an Upgrade 2026 progress export."); }
  };
  reader.readAsText(file);
});
document.getElementById("printBtn").addEventListener("click", () => window.print());
["search","filterLevel","filterPriority"].forEach(id => document.getElementById(id).addEventListener("input", () => {
  renderNav();
  const h = location.hash.replace(/^#/,"") || "dashboard";
  if(h === "curriculum" || h.startsWith("topic/")){
    const inner = document.getElementById("mainInner");
    if(inner && h === "curriculum") inner.innerHTML = curriculumHome();
  }
}));
function openDrawer(){
  document.getElementById("sidebar").classList.add("open");
  document.getElementById("backdrop").classList.add("show");
  document.getElementById("menuBtn").setAttribute("aria-expanded","true");
  document.body.style.overflow = "hidden";
}
function closeDrawer(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("backdrop").classList.remove("show");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  document.body.style.overflow = "";
}
function openSheet(){
  const s = document.getElementById("moreSheet");
  s.classList.add("show");
  s.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  const s = document.getElementById("moreSheet");
  s.classList.remove("show");
  s.setAttribute("aria-hidden","true");
  if(!document.getElementById("sidebar").classList.contains("open")) document.body.style.overflow = "";
}
document.getElementById("menuBtn").addEventListener("click", () => {
  const sb = document.getElementById("sidebar");
  if(sb.classList.contains("open")) closeDrawer();
  else openDrawer();
});
document.getElementById("closeSidebar")?.addEventListener("click", closeDrawer);
document.getElementById("backdrop").addEventListener("click", closeDrawer);
document.getElementById("sidebar").addEventListener("click", e => { if(e.target.closest("a")) closeDrawer(); });
document.getElementById("moreBtn")?.addEventListener("click", openSheet);
document.getElementById("moreBtnBottom")?.addEventListener("click", openSheet);
document.getElementById("sheetBackdrop")?.addEventListener("click", closeSheet);
document.getElementById("closeSheet")?.addEventListener("click", closeSheet);
document.querySelectorAll("#moreSheet a").forEach(a => a.addEventListener("click", closeSheet));
document.getElementById("themeBtnMobile")?.addEventListener("click", () => { setTheme(state.theme === "dark" ? "light" : "dark"); closeSheet(); });
document.getElementById("exportBtnMobile")?.addEventListener("click", () => { document.getElementById("exportBtn").click(); closeSheet(); });
document.getElementById("importBtnMobile")?.addEventListener("click", () => { document.getElementById("importBtn").click(); closeSheet(); });
document.getElementById("printBtnMobile")?.addEventListener("click", () => { window.print(); closeSheet(); });
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ closeDrawer(); closeSheet(); }
  if(e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA" && document.activeElement.tagName !== "SELECT"){
    e.preventDefault(); location.hash = "#curriculum"; setTimeout(() => document.getElementById("search")?.focus(), 50);
  }
});
window.addEventListener("resize", syncHeader);
window.addEventListener("hashchange", route);
renderNav();
route();
</script>
</body>
